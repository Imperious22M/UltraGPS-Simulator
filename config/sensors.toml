# Simulated hardware: how each receiver's tick count really relates to
# distance (distance_cm = tick * slope + intercept) in the simulator.
#
# This is the "truth" the sensor model uses to turn distances into ticks.  It
# is separate from config.toml, which holds the calibration the positioning
# library uses and which the calibration routine and the "Modify calibration
# values" window write to.  Both start from the real calibration in
# UltraGPS-Control's config.toml.  Edit this file to model hardware that has
# drifted from its calibration.

